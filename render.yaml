services:
  # ── Backend Web Service (Node/Express + WebSockets) ─────────────────────────
  - type: web
    name: flight-backend
    env: node
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/flights/radar?lamin=0&lomin=0&lamax=10&lomax=10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AVIATIONSTACK_KEY
        sync: false
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      - key: DB_URL
        sync: false

  # ── Frontend Static Site (React) ───────────────────────────────────────────
  - type: web
    name: flight-frontend
    env: static
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: flight-backend
          property: host
      - key: REACT_APP_WS_URL
        fromService:
          type: web
          name: flight-backend
          property: host
